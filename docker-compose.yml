services:
  postgres:
    image: postgres:16
    container_name: jobrunner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobrunner
      POSTGRES_PASSWORD: jobrunner
      POSTGRES_DB: jobrunner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobrunner"]
      interval: 5s
      retries: 10
    

volumes:
  pgdata: